<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day 3: Form Auto-save</title>
    <style>
:root { --bg:#fafaf7; --fg:#1d2a2a; --card:#ffffff; --line:#d5d9d4; --accent:#0f766e; }
body.dark { --bg:#14201f; --fg:#e8efec; --card:#1d2d2b; --line:#34504c; --accent:#5eead4; }
* { box-sizing:border-box; }
body { margin:0; padding:2rem 1rem; font-family:system-ui,sans-serif; background:var(--bg); color:var(--fg); line-height:1.5; }
main { max-width:32rem; margin:0 auto; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:1.5rem; }
h1 { margin-top:0; font-size:1.4rem; }
label { display:block; margin:.75rem 0 .25rem; font-weight:600; }
input, textarea, button, select { font:inherit; padding:.5rem .75rem; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); width:100%; }
button { width:auto; background:var(--accent); color:var(--bg); border-color:var(--accent); cursor:pointer; font-weight:600; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
.status { margin-top:.75rem; min-height:1.5rem; font-size:.9rem; }
ul { padding-left:1.2rem; }
</style>
</head>
<body>
    <main>
        <h1>Contact form with auto-save</h1>
        <form id="contact-form">
            <label for="name">Name</label>
            <input id="name" name="name" required />
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required />
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" required></textarea>
            <p><button type="submit">Send message</button></p>
        </form>
        <p class="status" id="status" aria-live="polite"></p>
    </main>
    <script type="module" src="script.js"></script>
</body>
</html>
